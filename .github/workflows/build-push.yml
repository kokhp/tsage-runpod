name: Build + push RunPod containers
on:
  push:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - '**/handler.py'
      - '**/requirements.txt'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        container:
          - tts-clone
          - tts-fast
          - tts-design
          - tts-parler
          - tts-cosyvoice3
          - tts-cpu
          - asr-whisper
          - asr-omnilingual
          - asr-realtime
          - asr-align
          - separator-gpu
          - separator-cpu
          - sfx
          - dialogue-en
          - vc
          - mt
          - agents-llm
          - agents-llm-big
          - lora-train
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse HEAD^ >/dev/null 2>&1; then
            # first commit on branch — build everything
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -q "^${{ matrix.container }}/"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -q "^.github/workflows/build-push.yml$"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        if: steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.container }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kokhp/tsage-runpod-${{ matrix.container }}:latest
            ghcr.io/kokhp/tsage-runpod-${{ matrix.container }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.container }}
          cache-to: type=gha,scope=${{ matrix.container }},mode=max
